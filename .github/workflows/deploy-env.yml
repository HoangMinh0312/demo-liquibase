name: Deploy Environment (env/*.yml)

# Trigger CHỈ khi file cấu hình môi trường thay đổi. Đổi SQL changeset, changelog, README... không chạy.
on:
  push:
    branches: [main]
    paths:
      - "env/dev.yml"
      - "env/uat.yml"
      - "env/prod.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Force deploy an environment from its env/*.yml"
        required: true
        type: choice
        options: [dev, uat, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-env
  cancel-in-progress: false

env:
  LIQUIBASE_VERSION: "4.33.0"
  JAVA_VERSION: "17"

jobs:
  detect:
    name: Detect changed env files
    runs-on: aks-runners
    outputs:
      dev: ${{ steps.changes.outputs.dev }}
      uat: ${{ steps.changes.outputs.uat }}
      prod: ${{ steps.changes.outputs.prod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine which env files changed
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed="env/${{ inputs.environment }}.yml"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
              before="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
            fi
            changed="$(git diff --name-only "$before" "${{ github.sha }}" -- env/ || true)"
          fi
          echo "Changed env files:"; echo "$changed"
          for e in dev uat prod; do
            if echo "$changed" | grep -qx "env/$e.yml"; then echo "$e=true" >> "$GITHUB_OUTPUT"; else echo "$e=false" >> "$GITHUB_OUTPUT"; fi
          done

  deploy_dev:
    name: Deploy (dev)
    needs: detect
    if: needs.detect.outputs.dev == 'true'
    runs-on: aks-runners
    env:
      # ---- DEV : database demo, schema dev ----
      ENV_FILE: env/dev.yml
      CHANGELOG_FILE: changelog.dev.yaml
      APP_SCHEMA: dev
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://pg-demo-liquibase-opd8e6.postgres.database.azure.com:5432/demo?sslmode=require
      LIQUIBASE_COMMAND_USERNAME: pgadmin
      LIQUIBASE_COMMAND_PASSWORD: "H#ng1234"
    steps:
      - uses: actions/checkout@v4
      - name: Read migration tag from ${{ env.ENV_FILE }}
        run: |
          tag=$(grep -E '^migration_tag:' "$ENV_FILE" | sed -E 's/^[^:]+:[[:space:]]*//; s/^"//; s/"$//')
          [ -n "$tag" ] || { echo "::error::migration_tag missing in $ENV_FILE"; exit 1; }
          echo "MIGRATION_TAG=$tag" >> "$GITHUB_ENV"
          echo "dev: deploying tag $tag to schema $APP_SCHEMA using $CHANGELOG_FILE"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: liquibase/setup-liquibase@v3
        with: { version: "${{ env.LIQUIBASE_VERSION }}", edition: oss }
      - name: Validate changelog
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" validate
      - name: Show pending changesets
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" status --verbose
      - name: Preview SQL
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" update-to-tag-sql --tag="${MIGRATION_TAG}"
      - name: Apply migration
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" update-to-tag --tag="${MIGRATION_TAG}"
      - name: Show history
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" history

  deploy_uat:
    name: Deploy (uat)
    needs: detect
    if: needs.detect.outputs.uat == 'true'
    runs-on: aks-runners
    env:
      # ---- UAT : database demo, schema uat ----
      ENV_FILE: env/uat.yml
      CHANGELOG_FILE: changelog.uat.yaml
      APP_SCHEMA: uat
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://pg-demo-liquibase-opd8e6.postgres.database.azure.com:5432/demo?sslmode=require
      LIQUIBASE_COMMAND_USERNAME: pgadmin
      LIQUIBASE_COMMAND_PASSWORD: "H#ng1234"
    steps:
      - uses: actions/checkout@v4
      - name: Read migration tag from ${{ env.ENV_FILE }}
        run: |
          tag=$(grep -E '^migration_tag:' "$ENV_FILE" | sed -E 's/^[^:]+:[[:space:]]*//; s/^"//; s/"$//')
          [ -n "$tag" ] || { echo "::error::migration_tag missing in $ENV_FILE"; exit 1; }
          echo "MIGRATION_TAG=$tag" >> "$GITHUB_ENV"
          echo "uat: deploying tag $tag to schema $APP_SCHEMA using $CHANGELOG_FILE"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: liquibase/setup-liquibase@v3
        with: { version: "${{ env.LIQUIBASE_VERSION }}", edition: oss }
      - name: Validate changelog
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" validate
      - name: Show pending changesets
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" status --verbose
      - name: Preview SQL
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" update-to-tag-sql --tag="${MIGRATION_TAG}"
      - name: Apply migration
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" update-to-tag --tag="${MIGRATION_TAG}"
      - name: Show history
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" history

  deploy_prod:
    name: Deploy (prod)
    needs: detect
    if: needs.detect.outputs.prod == 'true'
    runs-on: aks-runners
    env:
      # ---- PROD : database demo, schema prd ----
      ENV_FILE: env/prod.yml
      CHANGELOG_FILE: changelog.prd.yaml
      APP_SCHEMA: prd
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://pg-demo-liquibase-opd8e6.postgres.database.azure.com:5432/demo?sslmode=require
      LIQUIBASE_COMMAND_USERNAME: pgadmin
      LIQUIBASE_COMMAND_PASSWORD: "H#ng1234"
    steps:
      - uses: actions/checkout@v4
      - name: Read migration tag from ${{ env.ENV_FILE }}
        run: |
          tag=$(grep -E '^migration_tag:' "$ENV_FILE" | sed -E 's/^[^:]+:[[:space:]]*//; s/^"//; s/"$//')
          [ -n "$tag" ] || { echo "::error::migration_tag missing in $ENV_FILE"; exit 1; }
          echo "MIGRATION_TAG=$tag" >> "$GITHUB_ENV"
          echo "prod: deploying tag $tag to schema $APP_SCHEMA using $CHANGELOG_FILE"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: liquibase/setup-liquibase@v3
        with: { version: "${{ env.LIQUIBASE_VERSION }}", edition: oss }
      - name: Validate changelog
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" validate
      - name: Show pending changesets
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" status --verbose
      - name: Preview SQL
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" update-to-tag-sql --tag="${MIGRATION_TAG}"
      - name: Apply migration
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" update-to-tag --tag="${MIGRATION_TAG}"
      - name: Show history
        run: liquibase --changelog-file="${CHANGELOG_FILE}" --default-schema-name="${APP_SCHEMA}" --liquibase-schema-name="${APP_SCHEMA}" history
